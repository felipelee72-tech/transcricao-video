<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Transcreva vídeos do YouTube colando a URL — legendas no navegador, sem servidor." />
  <title>Transcrição YouTube</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface-2: #243044;
      --text: #e8edf4;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #f87171;
      --success: #4ade80;
      --radius: 14px;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: max(1.25rem, env(safe-area-inset-top)) 1rem max(2rem, env(safe-area-inset-bottom));
    }

    header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    header h1 {
      margin: 0 0 0.35rem;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .url-row {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    @media (min-width: 480px) {
      .url-row {
        flex-direction: row;
      }
    }

    input[type="url"] {
      flex: 1;
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1px solid var(--surface-2);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
    }

    input[type="url"]:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    input[type="url"]::placeholder {
      color: var(--muted);
      opacity: 0.7;
    }

    button {
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 0.85rem 1.25rem;
      transition: background 0.15s, opacity 0.15s, transform 0.1s;
    }

    button:active:not(:disabled) {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      white-space: nowrap;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      width: 100%;
      margin-top: 0.75rem;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #2d3d52;
    }

    .status {
      margin-top: 1rem;
      min-height: 1.25rem;
      font-size: 0.875rem;
      color: var(--muted);
    }

    .status.error {
      color: var(--danger);
    }

    .status.ok {
      color: var(--success);
    }

    .status.loading {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .spinner {
      width: 1rem;
      height: 1rem;
      border: 2px solid var(--surface-2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .output-section {
      margin-top: 1.5rem;
    }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .output-header span {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    textarea {
      width: 100%;
      min-height: 280px;
      padding: 1rem;
      border: 1px solid var(--surface-2);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      line-height: 1.6;
      resize: vertical;
    }

    textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Transcrição YouTube</h1>
      <p>Cole o link do vídeo e extraia as legendas no celular — sem servidor.</p>
    </header>

    <main class="card">
      <form id="form" autocomplete="off">
        <label for="url">URL do YouTube</label>
        <div class="url-row">
          <input
            id="url"
            type="url"
            inputmode="url"
            placeholder="https://www.youtube.com/watch?v=..."
            required
          />
          <button type="submit" class="btn-primary" id="btnTranscribe">Transcrever</button>
        </div>
      </form>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <section class="output-section" id="outputSection" hidden>
        <div class="output-header">
          <span>Transcrição</span>
          <span id="metaLang"></span>
        </div>
        <textarea id="output" readonly placeholder="O texto aparecerá aqui…"></textarea>
        <button type="button" class="btn-secondary" id="btnCopy">Copiar tudo</button>
      </section>
    </main>

    <footer>
      Legendas via API pública de transcrição. Vídeos sem legenda disponível não podem ser transcritos.
    </footer>
  </div>

  <script>
    (function () {
      const FETCH_TIMEOUT_MS = 25000;
      const TIMEDTEXT_BASE = 'https://www.youtube.com/api/timedtext';
      const TRANSCRIPT_API = 'https://youtube-transcript.ai/transcript';

      const LANG_ATTEMPTS = [
        { id: 'pt-BR', lang: 'pt-BR' },
        { id: 'pt', lang: 'pt' },
        { id: 'en', lang: 'en' },
        { id: 'a.en', lang: 'a-en' },
        { id: 'auto', lang: '' },
      ];

      const TIMEDTEXT_TRACKS = [
        { id: 'pt-BR', lang: 'pt-BR', auto: false },
        { id: 'pt', lang: 'pt', auto: false },
        { id: 'en', lang: 'en', auto: false },
        { id: 'a.pt', lang: 'pt', auto: true },
        { id: 'a.en', lang: 'en', auto: true },
      ];

      const PROXY_MODES = [
        { id: 'direct', wrap: function (url) { return url; }, parse: parseDirectBody },
        {
          id: 'allorigins',
          wrap: function (url) {
            return 'https://api.allorigins.win/get?url=' + encodeURIComponent(url);
          },
          parse: parseAllOriginsBody,
        },
        {
          id: 'corsproxy',
          wrap: function (url) {
            return 'https://corsproxy.io/?' + encodeURIComponent(url);
          },
          parse: parseDirectBody,
        },
        {
          id: 'codetabs',
          wrap: function (url) {
            return 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url);
          },
          parse: parseDirectBody,
        },
      ];

      const form = document.getElementById('form');
      const urlInput = document.getElementById('url');
      const btnTranscribe = document.getElementById('btnTranscribe');
      const btnCopy = document.getElementById('btnCopy');
      const statusEl = document.getElementById('status');
      const outputSection = document.getElementById('outputSection');
      const outputEl = document.getElementById('output');
      const metaLang = document.getElementById('metaLang');

      function buildTimedTextUrl(videoId, track) {
        const params = new URLSearchParams({
          v: videoId,
          lang: track.lang,
          fmt: 'json3',
        });
        if (track.auto) {
          params.set('kind', 'asr');
        }
        return TIMEDTEXT_BASE + '?' + params.toString();
      }

      function buildTranscriptApiUrl(videoId, lang) {
        const suffix = lang ? '?lang=' + encodeURIComponent(lang) : '';
        return TRANSCRIPT_API + '/' + encodeURIComponent(videoId) + '.txt' + suffix;
      }

      function decodeHtmlEntities(text) {
        return String(text || '')
          .replace(/&nbsp;/gi, ' ')
          .replace(/&amp;/gi, '&')
          .replace(/&lt;/gi, '<')
          .replace(/&gt;/gi, '>')
          .replace(/&quot;/gi, '"')
          .replace(/&#39;/g, "'")
          .replace(/&#x27;/gi, "'")
          .replace(/&#(\d+);/g, function (_, code) {
            return String.fromCharCode(Number(code));
          });
      }

      function cleanCueLine(line) {
        return decodeHtmlEntities(line)
          .replace(/<[^>]*>/g, '')
          .replace(/^[>›»]+\s*/g, '')
          .replace(/\s+/g, ' ')
          .trim();
      }

      function extractTranscriptCueLines(body) {
        const lines = [];
        const timestampRe = /\[(\d{1,2}:)?\d{1,2}:\d{2}(?::\d{2})?\]\s*/g;
        const markers = [];
        let match;

        while ((match = timestampRe.exec(body)) !== null) {
          markers.push({ start: match.index, end: match.index + match[0].length });
        }

        if (markers.length > 0) {
          for (let i = 0; i < markers.length; i++) {
            const chunkStart = markers[i].end;
            const chunkEnd = i + 1 < markers.length ? markers[i + 1].start : body.length;
            const chunk = body.slice(chunkStart, chunkEnd).replace(/\n+/g, ' ').trim();
            const cleaned = cleanCueLine(chunk);
            if (cleaned) {
              lines.push(cleaned);
            }
          }
          return lines;
        }

        return body
          .split(/\n+/)
          .map(function (row) {
            return cleanCueLine(row.replace(/^\[[\d:]+\]\s*/, ''));
          })
          .filter(Boolean);
      }

      function splitSpeakerSegments(text) {
        return String(text || '')
          .split(/\s*(?:>>|››|»»)\s*/g)
          .map(cleanCueLine)
          .filter(Boolean);
      }

      function collapseInlineRepeats(text) {
        let result = cleanCueLine(text);
        if (!result) {
          return '';
        }

        for (let pass = 0; pass < 10; pass++) {
          const repeated = result.match(/(.{4,}?)(?:\s+\1){1,}/);
          if (!repeated) {
            break;
          }
          const phrase = repeated[1];
          const escaped = phrase.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          result = result.replace(new RegExp('(' + escaped + ')(?:\\s+\\1)+', 'g'), '$1');
        }

        return result.trim();
      }

      function expandCueLines(lines) {
        const expanded = [];

        for (let i = 0; i < lines.length; i++) {
          const cleaned = cleanCueLine(lines[i]);
          if (!cleaned) {
            continue;
          }

          const segments = splitSpeakerSegments(cleaned);
          if (segments.length > 1) {
            for (let j = 0; j < segments.length; j++) {
              const segment = collapseInlineRepeats(segments[j]);
              if (segment) {
                expanded.push(segment);
              }
            }
          } else {
            const segment = collapseInlineRepeats(cleaned);
            if (segment) {
              expanded.push(segment);
            }
          }
        }

        return expanded;
      }

      function deduplicateRollingCaptions(lines) {
        const uniqueLines = [];
        const seenExact = new Set();
        const expanded = expandCueLines(lines);

        for (let i = 0; i < expanded.length; i++) {
          const cleaned = expanded[i];
          const key = normalizeForComparison(cleaned);
          if (!key) {
            continue;
          }

          if (uniqueLines.length > 0) {
            const lastIndex = uniqueLines.length - 1;
            const lastKey = normalizeForComparison(uniqueLines[lastIndex]);

            if (key === lastKey) {
              continue;
            }

            if (key.startsWith(lastKey) || lastKey.startsWith(key)) {
              if (key.length >= lastKey.length) {
                seenExact.delete(lastKey);
                uniqueLines[lastIndex] = cleaned;
                seenExact.add(key);
              }
              continue;
            }
          }

          if (seenExact.has(key)) {
            continue;
          }

          uniqueLines.push(cleaned);
          seenExact.add(key);
        }

        return uniqueLines;
      }

      function parseTranscriptTxt(raw) {
        const text = String(raw || '');
        if (!text.includes('## Transcript')) {
          return '';
        }

        const body = (text.split('## Transcript')[1] || '').split(/^---$/m)[0];
        const cueLines = extractTranscriptCueLines(body);
        const uniqueLines = deduplicateRollingCaptions(cueLines);

        return buildParagraphs(uniqueLines);
      }

      function readTranscriptLanguage(raw) {
        const match = String(raw || '').match(/^Language:\s*(.+)$/m);
        return match ? match[1].trim() : '';
      }

      function transcriptMatchesAttempt(attempt, reportedLang) {
        const reported = String(reportedLang || '').toLowerCase();

        if (attempt.lang === 'pt-BR') {
          return reported.indexOf('pt-br') !== -1 || reported.indexOf('pt') === 0;
        }

        if (attempt.lang === 'pt') {
          return reported.indexOf('pt') !== -1;
        }

        if (attempt.lang === 'en' || attempt.lang === 'a-en') {
          return reported.indexOf('en') !== -1;
        }

        return reported.length > 0;
      }

      async function fetchTranscriptFromApi(videoId, attempt) {
        const url = buildTranscriptApiUrl(videoId, attempt.lang);
        const response = await fetchWithTimeout(url, { headers: { Accept: 'text/plain' } }, FETCH_TIMEOUT_MS);

        if (!response.ok) {
          return null;
        }

        const raw = await response.text();
        const text = parseTranscriptTxt(raw);
        if (!text) {
          return null;
        }

        const reportedLang = readTranscriptLanguage(raw);
        if (attempt.lang && !transcriptMatchesAttempt(attempt, reportedLang)) {
          return null;
        }

        const auto = /auto/i.test(reportedLang);

        return {
          language: attempt.id,
          sourceType: auto ? 'auto-caption' : 'subtitle',
          text: text,
        };
      }

      async function fetchCaptionsFromTranscriptApi(videoId, onProgress) {
        for (let i = 0; i < LANG_ATTEMPTS.length; i++) {
          const attempt = LANG_ATTEMPTS[i];
          if (onProgress) {
            onProgress(attempt.id);
          }

          try {
            const result = await fetchTranscriptFromApi(videoId, attempt);
            if (result) {
              return result;
            }
          } catch {
            /* tenta próximo idioma */
          }
        }

        return null;
      }

      function parseDirectBody(body) {
        return typeof body === 'string' ? body : '';
      }

      function parseAllOriginsBody(body) {
        try {
          const wrapper = JSON.parse(body);
          return typeof wrapper.contents === 'string' ? wrapper.contents : '';
        } catch {
          return '';
        }
      }

      function setStatus(message, type) {
        statusEl.className = 'status' + (type ? ' ' + type : '');
        if (type === 'loading') {
          statusEl.innerHTML = '<span class="spinner" aria-hidden="true"></span><span>' + escapeHtml(message) + '</span>';
          statusEl.classList.add('loading');
        } else {
          statusEl.textContent = message;
        }
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function extractVideoId(input) {
        const trimmed = String(input || '').trim();
        if (!trimmed) return null;

        try {
          const url = new URL(trimmed.startsWith('http') ? trimmed : 'https://' + trimmed);
          const host = url.hostname.replace(/^www\./, '');

          if (host === 'youtu.be') {
            const id = url.pathname.slice(1).split('/')[0];
            return id && id.length >= 6 ? id : null;
          }

          if (host === 'youtube.com' || host === 'm.youtube.com' || host === 'music.youtube.com') {
            const v = url.searchParams.get('v');
            if (v) return v;

            const embed = url.pathname.match(/^\/(?:embed|shorts|live)\/([^/?]+)/);
            if (embed) return embed[1];
          }
        } catch {
          /* fallthrough */
        }

        const loose = trimmed.match(/(?:v=|\/embed\/|\/shorts\/|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
        return loose ? loose[1] : null;
      }

      async function fetchWithTimeout(url, options, timeoutMs) {
        const controller = new AbortController();
        const timer = setTimeout(function () {
          controller.abort();
        }, timeoutMs);

        try {
          return await fetch(url, Object.assign({}, options || {}, { signal: controller.signal }));
        } finally {
          clearTimeout(timer);
        }
      }

      function normalizeForComparison(text) {
        return text
          .trim()
          .toLowerCase()
          .replace(/\s+/g, ' ')
          .replace(/[.,!?;:…]+$/u, '')
          .trim();
      }

      function deduplicateLines(lines) {
        return deduplicateRollingCaptions(
          lines.map(function (line) {
            return cleanCueLine(line);
          }),
        );
      }

      function endsWithSentencePunctuation(text) {
        return /[.!?…][\s"')\]]*$/u.test(text.trim());
      }

      function buildParagraphs(lines) {
        if (lines.length === 0) return '';

        const sentences = [];
        for (let i = 0; i < lines.length; i++) {
          const parts = lines[i].split(/(?<=[.!?…])\s+/u).filter(Boolean);
          if (parts.length > 1) {
            for (let j = 0; j < parts.length; j++) {
              sentences.push(parts[j].trim());
            }
          } else {
            sentences.push(lines[i]);
          }
        }

        const paragraphs = [];
        let block = [];

        function flushBlock() {
          if (block.length === 0) return;
          paragraphs.push(block.join(' '));
          block = [];
        }

        for (let i = 0; i < sentences.length; i++) {
          const sentence = sentences[i];
          block.push(sentence);
          const reachedMax = block.length >= 5;
          const reachedMin = block.length >= 3 && endsWithSentencePunctuation(sentence);
          if (reachedMax || reachedMin) flushBlock();
        }

        flushBlock();
        return paragraphs.join('\n\n').trim();
      }

      function parseJson3Captions(raw) {
        try {
          const trimmed = String(raw || '').trim();
          if (!trimmed || trimmed.charAt(0) !== '{') {
            return '';
          }

          const data = JSON.parse(trimmed);
          const lines = (data.events || [])
            .filter(function (e) {
              return e.segs;
            })
            .map(function (e) {
              return cleanCueLine(
                e.segs
                  .map(function (s) {
                    return s.utf8 || '';
                  })
                  .join('')
                  .replace(/\n/g, ' '),
              );
            })
            .filter(Boolean);

          const uniqueLines = deduplicateLines(lines);
          return buildParagraphs(uniqueLines);
        } catch {
          return '';
        }
      }

      async function fetchTimedTextBody(apiUrl, mode) {
        const requestUrl = mode.wrap(apiUrl);
        const response = await fetchWithTimeout(requestUrl, {}, FETCH_TIMEOUT_MS);

        if (!response.ok) {
          return '';
        }

        const raw = await response.text();
        const body = mode.parse(raw);
        return body.trim();
      }

      async function fetchCaptionForTrack(videoId, track) {
        const apiUrl = buildTimedTextUrl(videoId, track);

        for (let m = 0; m < PROXY_MODES.length; m++) {
          const mode = PROXY_MODES[m];
          try {
            const body = await fetchTimedTextBody(apiUrl, mode);
            if (!body) continue;

            const text = parseJson3Captions(body);
            if (text) {
              return {
                language: track.id,
                sourceType: track.auto ? 'auto-caption' : 'subtitle',
                text: text,
              };
            }
          } catch {
            /* tenta próximo modo */
          }
        }

        return null;
      }

      async function fetchCaptionsFromTimedText(videoId, onProgress) {
        for (let t = 0; t < TIMEDTEXT_TRACKS.length; t++) {
          const track = TIMEDTEXT_TRACKS[t];
          if (onProgress) {
            onProgress(track.id);
          }

          const result = await fetchCaptionForTrack(videoId, track);
          if (result) {
            return result;
          }
        }

        return null;
      }

      async function transcribeYouTubeUrl(input, onProgress) {
        const videoId = extractVideoId(input);
        if (!videoId) {
          throw new Error('URL inválida. Cole um link do YouTube (watch, shorts ou youtu.be).');
        }

        let result = await fetchCaptionsFromTranscriptApi(videoId, onProgress);

        if (!result) {
          if (onProgress) {
            onProgress('timedtext');
          }
          result = await fetchCaptionsFromTimedText(videoId, onProgress);
        }

        if (!result || !result.text.trim()) {
          throw new Error(
            'Não foi encontrada legenda acessível para este vídeo. Verifique se o vídeo tem legendas (manuais ou automáticas) e se está público.'
          );
        }

        return result;
      }

      function setBusy(busy) {
        btnTranscribe.disabled = busy;
        urlInput.disabled = busy;
        btnCopy.disabled = busy;
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        outputSection.hidden = true;
        outputEl.value = '';
        metaLang.textContent = '';

        const url = urlInput.value.trim();
        if (!url) {
          setStatus('Informe a URL do vídeo.', 'error');
          return;
        }

        setBusy(true);
        setStatus('Buscando legendas…', 'loading');

        try {
          const result = await transcribeYouTubeUrl(url, function (trackId) {
            setStatus('Buscando legendas (' + trackId + ')…', 'loading');
          });
          outputEl.value = result.text;
          outputSection.hidden = false;

          const langLabel = result.language ? result.language.toUpperCase() : '';
          const typeLabel =
            result.sourceType === 'auto-caption' ? 'automática' : 'manual';
          metaLang.textContent = langLabel
            ? langLabel + ' · ' + typeLabel
            : typeLabel;

          setStatus('Transcrição pronta.', 'ok');
        } catch (err) {
          const msg =
            err && err.name === 'AbortError'
              ? 'Tempo esgotado. Verifique sua conexão e tente de novo.'
              : err && err.message
                ? err.message
                : 'Erro ao buscar legendas. Tente novamente.';
          setStatus(msg, 'error');
        } finally {
          setBusy(false);
        }
      });

      btnCopy.addEventListener('click', async function () {
        const text = outputEl.value.trim();
        if (!text) {
          setStatus('Nada para copiar.', 'error');
          return;
        }

        try {
          await navigator.clipboard.writeText(text);
          setStatus('Copiado para a área de transferência.', 'ok');
        } catch {
          outputEl.select();
          outputEl.setSelectionRange(0, text.length);
          const ok = document.execCommand('copy');
          setStatus(
            ok ? 'Copiado para a área de transferência.' : 'Não foi possível copiar. Selecione o texto manualmente.',
            ok ? 'ok' : 'error'
          );
        }
      });

      if (location.search) {
        const params = new URLSearchParams(location.search);
        const v = params.get('v') || params.get('url');
        if (v) {
          urlInput.value = v.indexOf('http') === 0 ? v : 'https://www.youtube.com/watch?v=' + v;
        }
      }
    })();
  </script>
</body>
</html>
