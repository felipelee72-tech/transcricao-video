<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Transcreva vídeos do YouTube colando a URL — legendas no navegador, sem servidor." />
  <title>Transcrição YouTube</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface-2: #243044;
      --text: #e8edf4;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #f87171;
      --success: #4ade80;
      --radius: 14px;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: max(1.25rem, env(safe-area-inset-top)) 1rem max(2rem, env(safe-area-inset-bottom));
    }

    header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    header h1 {
      margin: 0 0 0.35rem;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .url-row {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    @media (min-width: 480px) {
      .url-row {
        flex-direction: row;
      }
    }

    input[type="url"] {
      flex: 1;
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1px solid var(--surface-2);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
    }

    input[type="url"]:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    input[type="url"]::placeholder {
      color: var(--muted);
      opacity: 0.7;
    }

    button {
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 0.85rem 1.25rem;
      transition: background 0.15s, opacity 0.15s, transform 0.1s;
    }

    button:active:not(:disabled) {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      white-space: nowrap;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      width: 100%;
      margin-top: 0.75rem;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #2d3d52;
    }

    .status {
      margin-top: 1rem;
      min-height: 1.25rem;
      font-size: 0.875rem;
      color: var(--muted);
    }

    .status.error {
      color: var(--danger);
    }

    .status.ok {
      color: var(--success);
    }

    .status.loading {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .spinner {
      width: 1rem;
      height: 1rem;
      border: 2px solid var(--surface-2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .output-section {
      margin-top: 1.5rem;
    }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .output-header span {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    textarea {
      width: 100%;
      min-height: 280px;
      padding: 1rem;
      border: 1px solid var(--surface-2);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      line-height: 1.6;
      resize: vertical;
    }

    textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Transcrição YouTube</h1>
      <p>Cole o link do vídeo e extraia as legendas no celular — sem servidor.</p>
    </header>

    <main class="card">
      <form id="form" autocomplete="off">
        <label for="url">URL do YouTube</label>
        <div class="url-row">
          <input
            id="url"
            type="url"
            inputmode="url"
            placeholder="https://www.youtube.com/watch?v=..."
            required
          />
          <button type="submit" class="btn-primary" id="btnTranscribe">Transcrever</button>
        </div>
      </form>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <section class="output-section" id="outputSection" hidden>
        <div class="output-header">
          <span>Transcrição</span>
          <span id="metaLang"></span>
        </div>
        <textarea id="output" readonly placeholder="O texto aparecerá aqui…"></textarea>
        <button type="button" class="btn-secondary" id="btnCopy">Copiar tudo</button>
      </section>
    </main>

    <footer>
      Usa legendas públicas do YouTube. Vídeos sem legenda não podem ser transcritos.
    </footer>
  </div>

  <script>
    (function () {
      const CORS_PROXY = 'https://corsproxy.io/?url=';
      const FETCH_TIMEOUT_MS = 20000;
      const MAX_TRACK_ATTEMPTS = 6;
      const PREFERRED_LANGS = ['pt-BR', 'pt', 'pt-PT', 'por', 'en', 'en-US', 'es'];

      const form = document.getElementById('form');
      const urlInput = document.getElementById('url');
      const btnTranscribe = document.getElementById('btnTranscribe');
      const btnCopy = document.getElementById('btnCopy');
      const statusEl = document.getElementById('status');
      const outputSection = document.getElementById('outputSection');
      const outputEl = document.getElementById('output');
      const metaLang = document.getElementById('metaLang');

      function proxyUrl(target) {
        return CORS_PROXY + encodeURIComponent(target);
      }

      function setStatus(message, type) {
        statusEl.className = 'status' + (type ? ' ' + type : '');
        if (type === 'loading') {
          statusEl.innerHTML = '<span class="spinner" aria-hidden="true"></span><span>' + escapeHtml(message) + '</span>';
          statusEl.classList.add('loading');
        } else {
          statusEl.textContent = message;
        }
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function extractVideoId(input) {
        const trimmed = String(input || '').trim();
        if (!trimmed) return null;

        try {
          const url = new URL(trimmed.startsWith('http') ? trimmed : 'https://' + trimmed);
          const host = url.hostname.replace(/^www\./, '');

          if (host === 'youtu.be') {
            const id = url.pathname.slice(1).split('/')[0];
            return id && id.length >= 6 ? id : null;
          }

          if (host === 'youtube.com' || host === 'm.youtube.com' || host === 'music.youtube.com') {
            const v = url.searchParams.get('v');
            if (v) return v;

            const embed = url.pathname.match(/^\/(?:embed|shorts|live)\/([^/?]+)/);
            if (embed) return embed[1];
          }
        } catch {
          /* fallthrough */
        }

        const loose = trimmed.match(/(?:v=|\/embed\/|\/shorts\/|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
        return loose ? loose[1] : null;
      }

      async function fetchWithTimeout(url, options, timeoutMs) {
        const controller = new AbortController();
        const timer = setTimeout(function () {
          controller.abort();
        }, timeoutMs);

        try {
          return await fetch(url, Object.assign({}, options || {}, { signal: controller.signal }));
        } finally {
          clearTimeout(timer);
        }
      }

      function extractYtInitialPlayerResponse(html) {
        const markers = ['ytInitialPlayerResponse = ', 'var ytInitialPlayerResponse = '];

        for (let i = 0; i < markers.length; i++) {
          const index = html.indexOf(markers[i]);
          if (index === -1) continue;
          const parsed = parseJsonObjectFrom(html, index + markers[i].length);
          if (parsed) return parsed;
        }

        return null;
      }

      function parseJsonObjectFrom(text, startIndex) {
        const start = text.indexOf('{', startIndex);
        if (start === -1) return null;

        let depth = 0;
        for (let index = start; index < text.length; index++) {
          const char = text[index];
          if (char === '{') depth += 1;
          else if (char === '}') {
            depth -= 1;
            if (depth === 0) {
              try {
                return JSON.parse(text.slice(start, index + 1));
              } catch {
                return null;
              }
            }
          }
        }
        return null;
      }

      function orderCaptionTracks(tracks) {
        const normalized = tracks
          .filter(function (t) {
            return typeof t.baseUrl === 'string' && t.baseUrl.length > 0;
          })
          .map(function (t) {
            return {
              languageCode: t.languageCode || '',
              kind: t.kind || '',
              baseUrl: t.baseUrl,
            };
          });

        const unique = [];
        const seen = new Set();

        for (let p = 0; p < PREFERRED_LANGS.length; p++) {
          const preferred = PREFERRED_LANGS[p];
          for (let i = 0; i < normalized.length; i++) {
            const track = normalized[i];
            const key = track.languageCode + ':' + track.kind;
            if (seen.has(key)) continue;
            if (track.languageCode === preferred || track.languageCode.indexOf(preferred + '-') === 0) {
              unique.push(track);
              seen.add(key);
            }
          }
        }

        for (let i = 0; i < normalized.length; i++) {
          const track = normalized[i];
          const key = track.languageCode + ':' + track.kind;
          if (!seen.has(key)) {
            unique.push(track);
            seen.add(key);
          }
        }

        return unique.sort(function (left, right) {
          const leftAsr = left.kind === 'asr' ? 1 : 0;
          const rightAsr = right.kind === 'asr' ? 1 : 0;
          return leftAsr - rightAsr;
        });
      }

      const TIMESTAMP_LINE =
        /^\d{1,2}:\d{2}(?::\d{2})?[.,]\d{0,3}\s*-->\s*\d{1,2}:\d{2}(?::\d{2})?[.,]\d{0,3}/;
      const SRT_TIMESTAMP_LINE =
        /^\d{1,2}:\d{2}:\d{2}[.,]\d{0,3}\s*-->\s*\d{1,2}:\d{2}:\d{2}[.,]\d{0,3}/;

      function subtitleFileToPlainText(content) {
        const cueLines = extractCueLines(content);
        const uniqueLines = deduplicateLines(cueLines);
        return buildParagraphs(uniqueLines);
      }

      function extractCueLines(content) {
        const lines = content.replace(/\r/g, '').split('\n');
        const cueLines = [];

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i].trim();
          if (shouldSkipLine(line)) continue;
          const cleaned = cleanCueLine(line);
          if (cleaned) cueLines.push(cleaned);
        }

        return cueLines;
      }

      function shouldSkipLine(line) {
        if (!line) return true;
        if (line === 'WEBVTT' || /^WEBVTT\b/i.test(line)) return true;
        if (/^Kind:/i.test(line) || /^Language:/i.test(line)) return true;
        if (line.startsWith('NOTE') || line.startsWith('STYLE') || line.startsWith('REGION')) return true;
        if (/^X-TIMESTAMP-MAP=/i.test(line)) return true;
        if (/^\d+$/.test(line)) return true;
        if (TIMESTAMP_LINE.test(line) || SRT_TIMESTAMP_LINE.test(line)) return true;
        if (/^(align|position|line|size|vertical):/i.test(line)) return true;
        return false;
      }

      function cleanCueLine(line) {
        return line
          .replace(/<[\d:.]+>/g, '')
          .replace(/<[^>]*>/g, '')
          .replace(/&nbsp;/gi, ' ')
          .replace(/&amp;/gi, '&')
          .replace(/&lt;/gi, '<')
          .replace(/&gt;/gi, '>')
          .replace(/&quot;/gi, '"')
          .replace(/&#39;/g, "'")
          .replace(/\s+/g, ' ')
          .trim();
      }

      function normalizeForComparison(text) {
        return text
          .trim()
          .toLowerCase()
          .replace(/\s+/g, ' ')
          .replace(/[.,!?;:…]+$/u, '')
          .trim();
      }

      function deduplicateLines(lines) {
        const uniqueLines = [];
        const recentKeys = [];

        for (let i = 0; i < lines.length; i++) {
          const displayLine = lines[i];
          const key = normalizeForComparison(displayLine);
          if (!key) continue;
          if (recentKeys.indexOf(key) !== -1) continue;
          uniqueLines.push(displayLine);
          recentKeys.push(key);
          if (recentKeys.length > 5) recentKeys.shift();
        }

        return uniqueLines;
      }

      function endsWithSentencePunctuation(text) {
        return /[.!?…][\s"')\]]*$/u.test(text.trim());
      }

      function buildParagraphs(lines) {
        if (lines.length === 0) return '';

        const paragraphs = [];
        let block = [];

        function flushBlock() {
          if (block.length === 0) return;
          paragraphs.push(block.join(' '));
          block = [];
        }

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          block.push(line);
          const reachedMax = block.length >= 6;
          const reachedMin = block.length >= 4 && endsWithSentencePunctuation(line);
          if (reachedMax || reachedMin) flushBlock();
        }

        flushBlock();
        return paragraphs.join('\n\n').trim();
      }

      function parseJson3Captions(raw) {
        try {
          const data = JSON.parse(raw);
          const lines = (data.events || [])
            .filter(function (e) {
              return e.segs;
            })
            .map(function (e) {
              return e.segs
                .map(function (s) {
                  return s.utf8 || '';
                })
                .join('');
            })
            .map(function (l) {
              return l.trim();
            })
            .filter(Boolean);

          const unique = [];
          const seen = new Set();
          for (let i = 0; i < lines.length; i++) {
            if (!seen.has(lines[i])) {
              seen.add(lines[i]);
              unique.push(lines[i]);
            }
          }
          return unique.join('\n').trim();
        } catch {
          return '';
        }
      }

      async function downloadCaptionBody(url) {
        try {
          const response = await fetchWithTimeout(proxyUrl(url), {}, FETCH_TIMEOUT_MS);
          if (!response.ok) return '';

          const body = await response.text();
          if (!body.trim()) return '';

          if (body.trimStart().startsWith('{')) {
            return parseJson3Captions(body);
          }

          return subtitleFileToPlainText(body);
        } catch {
          return '';
        }
      }

      async function downloadCaptionTrackUrl(baseUrl) {
        const formats = [
          baseUrl.indexOf('fmt=') !== -1 ? baseUrl : baseUrl + (baseUrl.indexOf('?') !== -1 ? '&' : '?') + 'fmt=vtt',
          baseUrl + (baseUrl.indexOf('?') !== -1 ? '&' : '?') + 'fmt=json3',
        ];

        for (let i = 0; i < formats.length; i++) {
          const text = await downloadCaptionBody(formats[i]);
          if (text) return text;
        }
        return '';
      }

      async function downloadBestCaptionTrack(tracks) {
        const ordered = orderCaptionTracks(tracks).slice(0, MAX_TRACK_ATTEMPTS);

        for (let i = 0; i < ordered.length; i++) {
          const track = ordered[i];
          const text = await downloadCaptionTrackUrl(track.baseUrl);
          if (text) {
            return {
              language: track.languageCode,
              sourceType: track.kind === 'asr' ? 'auto-caption' : 'subtitle',
              text: text,
            };
          }
        }
        return null;
      }

      async function loadCaptionTracksFromPage(pageUrl) {
        try {
          const response = await fetchWithTimeout(proxyUrl(pageUrl), {}, FETCH_TIMEOUT_MS);
          if (!response.ok) return [];

          const html = await response.text();
          const player = extractYtInitialPlayerResponse(html);
          if (!player) return [];

          return player.captions?.playerCaptionsTracklistRenderer?.captionTracks || [];
        } catch {
          return [];
        }
      }

      async function fetchCaptionsFromWatchPage(videoId) {
        const pageUrls = [
          'https://www.youtube.com/watch?v=' + encodeURIComponent(videoId) + '&hl=pt',
          'https://www.youtube.com/embed/' + encodeURIComponent(videoId),
        ];

        for (let i = 0; i < pageUrls.length; i++) {
          const tracks = await loadCaptionTracksFromPage(pageUrls[i]);
          const result = await downloadBestCaptionTrack(tracks);
          if (result) return result;
        }
        return null;
      }

      function readXmlAttr(attrString, name) {
        const match = attrString.match(new RegExp(name + '="([^"]*)"', 'i'));
        return match ? match[1] : '';
      }

      function parseTrackList(xml) {
        const tracks = [];
        const trackRegex = /<track\b([^>]+)\/?>/gi;
        let match;
        while ((match = trackRegex.exec(xml)) !== null) {
          const attrs = match[1];
          const lang = readXmlAttr(attrs, 'lang_code') || readXmlAttr(attrs, 'lang_code_original');
          if (!lang) continue;
          tracks.push({
            lang: lang,
            kind: readXmlAttr(attrs, 'kind') || '',
            name: readXmlAttr(attrs, 'name') || '',
          });
        }
        return tracks;
      }

      function orderTimedTextTracks(tracks) {
        const unique = [];
        const seen = new Set();

        for (let p = 0; p < PREFERRED_LANGS.length; p++) {
          const preferred = PREFERRED_LANGS[p];
          for (let i = 0; i < tracks.length; i++) {
            const track = tracks[i];
            const key = track.lang + ':' + track.kind;
            if (seen.has(key)) continue;
            if (track.lang === preferred || track.lang.indexOf(preferred + '-') === 0) {
              unique.push(track);
              seen.add(key);
            }
          }
        }

        for (let i = 0; i < tracks.length; i++) {
          const track = tracks[i];
          const key = track.lang + ':' + track.kind;
          if (!seen.has(key)) {
            unique.push(track);
            seen.add(key);
          }
        }

        return unique.sort(function (left, right) {
          const leftAsr = left.kind === 'asr' ? 1 : 0;
          const rightAsr = right.kind === 'asr' ? 1 : 0;
          return leftAsr - rightAsr;
        });
      }

      function buildFallbackTracks() {
        const out = [];
        for (let i = 0; i < PREFERRED_LANGS.length; i++) {
          const lang = PREFERRED_LANGS[i];
          out.push({ lang: lang, kind: '', name: '' });
          out.push({ lang: lang, kind: 'asr', name: '' });
        }
        return out;
      }

      async function listTimedTextTracks(videoId) {
        const url =
          'https://www.youtube.com/api/timedtext?v=' + encodeURIComponent(videoId) + '&type=list';

        try {
          const response = await fetchWithTimeout(proxyUrl(url), {}, FETCH_TIMEOUT_MS);
          if (!response.ok) return [];
          return parseTrackList(await response.text());
        } catch {
          return [];
        }
      }

      async function downloadTimedTextTrack(videoId, track) {
        const params = new URLSearchParams({
          v: videoId,
          lang: track.lang,
          fmt: 'vtt',
        });
        if (track.kind === 'asr') params.set('kind', 'asr');
        if (track.name) params.set('name', track.name);

        const url = 'https://www.youtube.com/api/timedtext?' + params.toString();

        try {
          const response = await fetchWithTimeout(proxyUrl(url), {}, FETCH_TIMEOUT_MS);
          if (!response.ok) return '';
          const vtt = await response.text();
          if (!vtt.trim()) return '';
          return subtitleFileToPlainText(vtt);
        } catch {
          return '';
        }
      }

      async function fetchCaptionsFromTimedText(videoId) {
        let tracks = await listTimedTextTracks(videoId);
        if (tracks.length === 0) tracks = buildFallbackTracks();

        const ordered = orderTimedTextTracks(tracks).slice(0, MAX_TRACK_ATTEMPTS);

        for (let i = 0; i < ordered.length; i++) {
          const track = ordered[i];
          const text = await downloadTimedTextTrack(videoId, track);
          if (text) {
            return {
              language: track.lang,
              sourceType: track.kind === 'asr' ? 'auto-caption' : 'subtitle',
              text: text,
            };
          }
        }
        return null;
      }

      async function transcribeYouTubeUrl(input) {
        const videoId = extractVideoId(input);
        if (!videoId) {
          throw new Error('URL inválida. Cole um link do YouTube (watch, shorts ou youtu.be).');
        }

        setStatus('Buscando legendas na página do vídeo…', 'loading');

        let result = await fetchCaptionsFromWatchPage(videoId);

        if (!result) {
          setStatus('Tentando API de legendas do YouTube…', 'loading');
          result = await fetchCaptionsFromTimedText(videoId);
        }

        if (!result || !result.text.trim()) {
          throw new Error(
            'Não foi encontrada legenda acessível para este vídeo. Verifique se o vídeo tem legendas (manuais ou automáticas) e se está público.'
          );
        }

        return result;
      }

      function setBusy(busy) {
        btnTranscribe.disabled = busy;
        urlInput.disabled = busy;
        btnCopy.disabled = busy;
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        outputSection.hidden = true;
        outputEl.value = '';
        metaLang.textContent = '';

        const url = urlInput.value.trim();
        if (!url) {
          setStatus('Informe a URL do vídeo.', 'error');
          return;
        }

        setBusy(true);
        setStatus('Processando…', 'loading');

        try {
          const result = await transcribeYouTubeUrl(url);
          outputEl.value = result.text;
          outputSection.hidden = false;

          const langLabel = result.language ? result.language.toUpperCase() : '';
          const typeLabel =
            result.sourceType === 'auto-caption' ? 'automática' : 'manual';
          metaLang.textContent = langLabel
            ? langLabel + ' · ' + typeLabel
            : typeLabel;

          setStatus('Transcrição pronta.', 'ok');
        } catch (err) {
          const msg =
            err && err.name === 'AbortError'
              ? 'Tempo esgotado. Verifique sua conexão e tente de novo.'
              : err && err.message
                ? err.message
                : 'Erro ao buscar legendas. Tente novamente.';
          setStatus(msg, 'error');
        } finally {
          setBusy(false);
        }
      });

      btnCopy.addEventListener('click', async function () {
        const text = outputEl.value.trim();
        if (!text) {
          setStatus('Nada para copiar.', 'error');
          return;
        }

        try {
          await navigator.clipboard.writeText(text);
          setStatus('Copiado para a área de transferência.', 'ok');
        } catch {
          outputEl.select();
          outputEl.setSelectionRange(0, text.length);
          const ok = document.execCommand('copy');
          setStatus(
            ok ? 'Copiado para a área de transferência.' : 'Não foi possível copiar. Selecione o texto manualmente.',
            ok ? 'ok' : 'error'
          );
        }
      });

      if (location.search) {
        const params = new URLSearchParams(location.search);
        const v = params.get('v') || params.get('url');
        if (v) {
          urlInput.value = v.indexOf('http') === 0 ? v : 'https://www.youtube.com/watch?v=' + v;
        }
      }
    })();
  </script>
</body>
</html>
